version: 0.2

phases:
  install:
    commands:
      - echo Install nginx
      - sudo apt update
      - sudo apt install nginx -y

  build:
    commands:
      - echo Build start on `date`
      - cp index.html /var/www/html

  post_build:
    commands:
      - echo configuration Nginx

artifacts:
  files:
    - /var/www/html/index.html
